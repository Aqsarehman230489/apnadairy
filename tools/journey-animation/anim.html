<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Brico'; src: url('bricolage-grotesque-latin-opsz-normal.woff2') format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'Nastaliq'; src: url('nastaliq.woff2') format('woff2'); }
html, body { margin: 0; background: #000; }
svg { display: block; font-family: 'Brico', sans-serif; }
</style></head>
<body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="parts.js"></script>
<script src="scenes.js"></script>
<script>
  // preview mode: plays in real time when opened directly
  if (!location.hash.includes('capture')) {
    const t0 = performance.now()
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }
    loop()
  }
</script>
</body></html>
